name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review per PR at a time; a new push cancels the review of the previous one.
concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # The action refuses bot actors (release-please, Dependabot, Claude's own pushes),
    # and GitHub gives fork PRs no secrets, so skip those instead of failing.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true

      # REVIEW.md reviews a vendor bump as the fork's commit range, so the
      # submodule needs both ends of the move.
      - name: Fetch both ends of a vendor bump
        id: vendor
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          old=$(git rev-parse "$BASE:Vendor/mlx-swift-lm")
          new=$(git rev-parse "HEAD:Vendor/mlx-swift-lm")
          if [ "$old" != "$new" ]; then
            git -C Vendor/mlx-swift-lm fetch --no-tags origin "$old" "$new"
            echo "range=$old..$new" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Anthropic's code-review plugin: parallel agents check bugs and CLAUDE.md compliance,
          # and each finding is validated before it is posted. It skips draft, closed, trivial
          # and automated PRs, and PRs Claude has already commented on.
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"

          # --comment posts an inline comment on each issue, or one summary comment when there are none.
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"

          # The action starts the inline comment server only when --allowedTools names it.
          # The plugin reads CLAUDE.md but not REVIEW.md, so the system prompt points it there.
          # See https://code.claude.com/docs/en/github-actions#run-a-skill
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git -C Vendor/mlx-swift-lm diff:*),Bash(git -C Vendor/mlx-swift-lm log:*),Bash(git -C Vendor/mlx-swift-lm show:*)"
            --append-system-prompt "REVIEW.md at the repository root holds the review rules for this repo: paths to skip, what counts as Important, and which decisions are settled. Read it before you start, include its rules in the prompt of every agent you launch, and post nothing it rules out.${{ steps.vendor.outputs.range && format(' This PR moves the Vendor/mlx-swift-lm submodule: review git -C Vendor/mlx-swift-lm diff {0} as REVIEW.md says.', steps.vendor.outputs.range) || '' }}"
