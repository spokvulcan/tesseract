# CI — lint on PRs; also build Release and test on pushes to main.
# Request a one-off PR build and test run by adding the run-build label, or
# run the full workflow manually from Actions on a selected branch. A PR that
# moves the Vendor/mlx-swift-lm gitlink also runs vendor-test.
#
# The release pipeline (release-build.yml) gates on these exact check names
# for the released commit: build-release, build-ios, test, lint. Rename them
# only in lockstep with the gate list there.
#
# Signing: CI builds use ad-hoc signing (CODE_SIGN_IDENTITY=-) — no
# certificates exist on PR runners. Real Developer ID signing happens only in
# release-build.yml.

name: CI

# Version-only changes (Release PRs and their merge commits) skip CI: the
# code is byte-identical to a main state CI already tested, and the release
# gate reads the parent commit's results instead (release-build.yml).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - version.txt
      - CHANGELOG.md
      - .release-please-manifest.json
  push:
    branches: [main]
    paths-ignore:
      - version.txt
      - CHANGELOG.md
      - .release-please-manifest.json
  workflow_dispatch:

permissions:
  contents: read

env:
  # Semver range so a runner-image refresh doesn't brick CI; keep the floor
  # roughly in sync with the local toolchain (currently Xcode 27.0). Each
  # Xcode major has its own runner image — macos-26 carries only 26.x — so a
  # major bump changes the jobs' runs-on label too (here and in
  # release-build.yml).
  XCODE_VERSION: "^27.0"

concurrency:
  # Label requests must not cancel the normal PR lint, and manual runs must
  # not queue ahead of the main-branch checks used by the release gate.
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name || 'checks' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-release:
    name: build-release
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-build')
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true # Vendor/mlx-swift-lm is a submodule (local SPM package)

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache SPM checkouts
        uses: actions/cache@v5
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('tesseract.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build (Release)
        run: |
          set -o pipefail
          FILTER="cat"; command -v xcbeautify >/dev/null && FILTER="xcbeautify"
          xcodebuild build \
            -project tesseract.xcodeproj \
            -scheme tesseract \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            2>&1 | "$FILTER"

  # The iPhone app (tesseract-ios, ADR-0084): built for any iOS device,
  # unsigned. No tests run on a device; the shared code's suites run in the
  # Mac test job.
  build-ios:
    name: build-ios
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-build')
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true # Vendor/mlx-swift-lm is a submodule (local SPM package)

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache SPM checkouts
        uses: actions/cache@v5
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('tesseract.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build (Release, iOS)
        run: |
          set -o pipefail
          FILTER="cat"; command -v xcbeautify >/dev/null && FILTER="xcbeautify"
          xcodebuild build \
            -project tesseract.xcodeproj \
            -scheme tesseract-ios \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | "$FILTER"

  test:
    name: test
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-build')
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true # Vendor/mlx-swift-lm is a submodule (local SPM package)

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache SPM checkouts
        uses: actions/cache@v5
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('tesseract.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Tests must run in Debug: Release lacks ENABLE_TESTABILITY for
      # @testable imports. They run in parallel, as the scheme and every local
      # run do, so a race that shows only in parallel fails here too
      # (docs/testing.md → Parallel runs share one test host).
      - name: Test (Debug)
        run: |
          set -o pipefail
          FILTER="cat"; command -v xcbeautify >/dev/null && FILTER="xcbeautify"
          xcodebuild test \
            -project tesseract.xcodeproj \
            -scheme tesseract \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -skipPackagePluginValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            2>&1 | "$FILTER"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7

  # The fork's carry branches have no CI of their own, so a PR that moves the
  # Vendor/mlx-swift-lm gitlink tests the fork here; a manual run always does.
  # Not part of the release gate.
  vendor-changed:
    name: vendor-changed
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action != 'labeled')
    runs-on: ubuntu-latest
    outputs:
      moved: ${{ steps.gitlink.outputs.moved }}
    steps:
      - uses: actions/checkout@v5
      - id: gitlink
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "moved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          old=$(git rev-parse "$BASE:Vendor/mlx-swift-lm")
          new=$(git rev-parse "HEAD:Vendor/mlx-swift-lm")
          echo "Vendor/mlx-swift-lm: $old -> $new"
          if [ "$old" = "$new" ]; then moved=false; else moved=true; fi
          echo "moved=$moved" >> "$GITHUB_OUTPUT"

  vendor-test:
    name: vendor-test
    needs: vendor-changed
    if: needs.vendor-changed.outputs.moved == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache SPM checkouts
        uses: actions/cache@v5
        with:
          path: Vendor/mlx-swift-lm/DerivedData/SourcePackages
          key: vendor-spm-${{ runner.os }}-${{ hashFiles('Vendor/mlx-swift-lm/Package.swift') }}
          restore-keys: vendor-spm-${{ runner.os }}-

      # MLXLMTests serialized with per-test timeouts (the parallel runner
      # hangs on this target), then DocC for the engine's targets.
      - name: MLXLMTests and DocC
        run: scripts/vendor-test.sh --docs

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: vendor-test-logs
          path: Vendor/mlx-swift-lm/DerivedData/vendor-test
          retention-days: 7

  lint:
    name: lint
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.63.2 # keep in sync with local `swiftlint version`
    steps:
      - uses: actions/checkout@v5
      - name: SwiftLint
        run: swiftlint lint --reporter github-actions-logging
