# SwiftLint — Tesseract Agent
#
# Runs on staged files in the pre-commit hook, and on every PR in CI (the lint
# job in .github/workflows/ci.yml).
# Division of labour: swift-format owns whitespace / width / indentation /
# import order; SwiftLint owns idiom & correctness smells. Rules that overlap
# with the formatter are disabled here so the two tools never fight.
#
# Structural-size limits are deliberately lenient: this is an evolving MVP
# mid-refactor (see CLAUDE.md) — the gate should catch real smells, not nag
# about file length.
#
# Rule reference: https://realm.github.io/SwiftLint/rule-directory.html

included:
  - tesseract
  - tesseract-ios
  - tesseract-share
  - tesseractTests
  - tesseractUITests

excluded:
  - Vendor
  - .build
  - DerivedData
  # Lab probe rig imported verbatim — the ledger's bitwise evidence came
  # from this exact text; app rules do not apply to it.
  - benchmarks/gather-sweep

disabled_rules:
  # Owned by swift-format — disabled to avoid double-reporting / conflicts.
  - line_length
  - trailing_comma
  - trailing_whitespace
  - trailing_newline
  - vertical_whitespace
  - opening_brace
  - statement_position
  - colon
  - comma
  # swift-format wraps long `call(args) { params in` signatures onto the next
  # line, which this rule then flags — an unwinnable fight. Layout is the
  # formatter's job, so it owns this too.
  - closure_parameter_position
  # Intentional in this codebase.
  - todo # TODO/FIXME are tracked deliberately, not lint debt.

opt_in_rules:
  - empty_count
  - empty_string
  - empty_collection_literal
  - first_where
  - last_where
  - contains_over_first_not_nil
  - sorted_first_last
  - toggle_bool
  - redundant_nil_coalescing
  - explicit_init
  - overridden_super_call
  - prefer_self_type_over_type_of_self

# Structural limits — lenient warnings, generous errors.
type_body_length:
  warning: 600
  error: 1500
file_length:
  warning: 1000
  error: 2500
  ignore_comment_only_lines: true
function_body_length:
  warning: 120
  error: 300
function_parameter_count:
  warning: 8
  error: 12
cyclomatic_complexity:
  warning: 25
  error: 45
large_tuple:
  warning: 3
  error: 4
nesting:
  type_level: 3

identifier_name:
  min_length:
    warning: 1
    error: 0
  max_length:
    warning: 60
    error: 80
type_name:
  max_length:
    warning: 50
    error: 60

# Test waits (docs/testing.md → Parallel runs share one test host). A parallel
# run shares one test host, so a wait bounded by a short budget or a count of
# yields fails tests whose code is fine. A negative check ("nothing more
# happens") keeps its plain fixed window: `for _ in 0..<N { await Task.yield() }`.
custom_rules:
  test_wait_budget:
    name: "Test wait budget"
    included: "tesseractTests/.*\\.swift$"
    regex: 'ContinuousClock\.now \+ \.(seconds|milliseconds)\(|\.now\.advanced\(by: \.(seconds|milliseconds)\(|timeout: Duration = \.(seconds|milliseconds)\('
    excluded_match_kinds: [comment, doccomment, string]
    message: "A wait's budget is waitBackstop; for @Observable state use observe(until:) (tesseractTests/Waiting.swift)"
    severity: error
  test_counted_wait:
    name: "Counted test wait"
    included: "tesseractTests/.*\\.swift$"
    regex: 'for _ in 0\.\.<[0-9_]+ where [^{]*\{\s*await Task\.yield\(\)'
    excluded_match_kinds: [comment, doccomment, string]
    message: "A count of yields can run out before the thread pool runs the work: use observe(until:) or waitUntil (tesseractTests/Waiting.swift)"
    severity: error
  agent_message_cast:
    name: "Agent message cast"
    # App code only; the accessors' home and the codec, which unwraps
    # CoreMessage itself, cast on purpose.
    included: "tesseract/(App|Core|Features|Models|Platform)/.*\\.swift$"
    excluded: "Features/Agent/Core/(AgentMessage|MessagePersistence)\\.swift$"
    regex: '\b(as[?!]?|is)\s+(UserMessage|AssistantMessage|ToolResultMessage)\b'
    excluded_match_kinds: [comment, doccomment, string]
    message: "Read an agent message through asUser, asAssistant or asToolResult: the chat keeps its user turns wrapped as CoreMessage.user, which a cast to the bare type misses"
    severity: error
